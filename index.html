<!DOCTYPE html>
<html lang="pt" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPSUSHI</title>
    <link rel="icon" href="assets/favicon.png" sizes="any" type="image/png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      :root { --gold: #c5a059; }
      body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #e0e0e0; }
      h1, h2, .card-title, .modal-title { font-family: 'Playfair Display', serif; }
      .gold-text { color: var(--gold); }
      .bg-gold { background-color: var(--gold) !important; color: #000 !important; }
      .nav-active { background-color: var(--gold) !important; color: #000 !important; font-weight: bold; }
      .product-img-container { background-color: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .nav-icon { width: 20px; height: 20px; object-fit: contain; }
      .card-sushi { border: 1px solid rgba(255,255,255,0.05); }
    </style>
  </head>
  <body class="flex flex-col w-full min-h-screen">
    
    <header class="navbar bg-black border-b border-white/10 px-4 md:px-10 sticky top-0 z-50">
      <div class="navbar-start">
        <img class="w-44 h-auto" src="assets/logotipo.png" alt="UPSUSHI Logo"/>
      </div>
      <div class="navbar-end">
        <button id="btn-open-bookings-modal" class="btn bg-gold border-none rounded-none uppercase text-xs tracking-widest font-bold px-8">
          Reservar mesa
        </button>
      </div>
    </header>

    <main class="relative grid grid-cols-[80px_1fr] md:grid-cols-[200px_1fr] flex-grow">
      <nav class="bg-[#161616] border-r border-white/5 py-6">
        <ul id="navbar" class="flex flex-col gap-2 px-2">
          <li id="nav-home" class="p-3 rounded-md hover:bg-white/5 cursor-pointer transition-all">
            <span class="uppercase text-[10px] tracking-widest font-bold">Home</span>
          </li>
          <li id="nav-sobre-nós" class="p-3 rounded-md hover:bg-white/5 cursor-pointer transition-all">
            <span class="uppercase text-[10px] tracking-widest font-bold">Sobre nós</span>
          </li>
          <li class="mt-6">
            <span class="text-[9px] gold-text font-black uppercase tracking-[3px] px-3 hidden md:block">Ementa</span>
            <div class="h-[1px] bg-white/10 my-2 mx-3 hidden md:block"></div>
            <ul id="ementa" class="flex flex-col gap-1"></ul>
          </li>
        </ul>
      </nav>

      <section class="p-4 md:p-10 bg-[#0a0a0a]">
        <div id="main-content" class="bg-[#121212] rounded-xl p-6 md:p-12 border border-white/5 min-h-full"></div>
      </section>
    </main>

    <footer class="w-full bg-black border-t border-white/10">
      <p class="text-center p-6 text-xs opacity-40 uppercase tracking-widest">© 2026 UPSUSHI. All rights reserved.</p>
    </footer>

    <dialog id="product-modal" class="modal"></dialog>
    <dialog id="bookings-modal" class="modal">
      <div class="modal-box bg-[#1a1a1a] border border-white/10 max-w-2xl rounded-none">
        <h3 class="modal-title text-3xl gold-text italic mb-6">Reservas</h3>
        <form id="form-reserva" class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
          <div class="form-control">
            <label class="label"><span class="label-text text-white/50 text-[10px] uppercase">Data e Hora</span></label>
            <input name="agenda" type="datetime-local" class="input input-bordered bg-black/40 border-white/10 rounded-none" required />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text text-white/50 text-[10px] uppercase">Pessoas</span></label>
            <input name="guests" type="number" class="input input-bordered bg-black/40 border-white/10 rounded-none" value="2" required />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text text-white/50 text-[10px] uppercase">Nome</span></label>
            <input name="name" type="text" class="input input-bordered bg-black/40 border-white/10 rounded-none" required />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text text-white/50 text-[10px] uppercase">Email</span></label>
            <input name="email" type="email" class="input input-bordered bg-black/40 border-white/10 rounded-none" required />
          </div>
          <div class="md:col-span-2 mt-4">
            <label class="label text-[10px] text-white/30 flex justify-start items-center gap-3 cursor-pointer mb-6">
              <input name="consent" type="checkbox" class="checkbox checkbox-xs border-white/20" required />
              Concordo com a coleta e o uso do meu nome e email conforme a GDPR.
            </label>
            <button type="submit" class="btn bg-gold border-none w-full rounded-none font-bold uppercase tracking-widest h-14">Enviar Solicitação de Reserva</button>
            <button type="button" class="btn btn-ghost btn-block mt-2 text-[10px] uppercase close-bookings-modal">Cancelar</button>
          </div>
        </form>
      </div>
    </dialog>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
