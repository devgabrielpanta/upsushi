<!DOCTYPE html>
<html lang="pt" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPSUSHI - Ementa</title>
    <link
      rel="icon"
      href="assets/favicon.png"
      sizes="any"
      type="image/png"
    />

    <!--Tailwind CSS + DaisyUI-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex flex-col w-full min-h-screen bg-base-300">
    <!-- HEADER -->
    <header class="navbar shadow-sm">
      <div class="navbar-start">UPSUSHI</div>
      <div class="navbar-end">
        <button id="btn-open-bookings-modal" class="btn btn-primary">
          Reservar mesa
        </button>
      </div>
    </header>
    <main
      class="relative grid grid-cols-[0.8fr_2fr] md:grid-cols-[1fr_4fr] lg:grid-cols-[1fr_10fr] flex-grow"
    >
      <!-- NAVIGATION -->
      <nav class="flex flex-col py-10 px-1 md:px-2 w-full h-full">
        <ul id="navbar" class="sticky top-16 flex flex-col w-full gap-2">
          <li
            id="nav-home"
            class="flex flex-row items-center py-1 rounded-lg pl-2 hover:bg-primary active:bg-primary cursor-pointer w-full"
          >
            <span class="capitalize text-sm">Home</span>
          </li>
          <li
            id="nav-sobre-nós"
            class="flex flex-row items-center py-1 rounded-lg pl-2 hover:bg-primary active:bg-primary cursor-pointer w-full"
          >
            <span class="capitalize text-sm">Sobre nós</span>
          </li>
          <li class="mb-2">
            <span class="capitalize text-sm pl-2">Ementa</span>
            <hr class="w-[75%]" />
            <!-- EMENTA/MENU -->
            <ul id="ementa" class="flex flex-col w-full gap-0 pl-2"></ul>
          </li>
        </ul>
      </nav>

      <!-- MAIN CONTENT -->
      <section class="flex w-full h-full py-10 px-1 md:px-10">
        <div
          id="main-content"
          class="w-full h-full rounded-lg p-10 bg-base-100"
        ></div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="w-full bg-base-300">
      <p class="text-center p-4">© 2026 UPSUSHI. All rights reserved.</p>
    </footer>

    <dialog id="product-modal" class="modal"></dialog>
    <dialog id="bookings-modal" class="modal">
      <div class="close-bookings-modal hero-overlay"></div>
      <div class="modal-box bg-base-300 flex flex-col items-center max-w-3xl">
        <div class="flex flex-row justify-between items-center w-full">
          <h3 class="font-bold text-lg text-left">Reservas</h3>
          <button class="close-bookings-modal btn btn-soft">cancelar</button>
        </div>
        <form class="flex flex-col items-center mt-10">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <fieldset
              class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
            >
              <legend class="fieldset-legend">Agenda</legend>

              <label class="label">Data e Hora</label>
              <input
                name="agenda"
                type="datetime-local"
                class="input"
                value=""
                required
              />

              <label class="label">Quantidade de Pessoas</label>
              <input
                name="guests"
                type="number"
                class="input"
                value="2"
                required
              />
            </fieldset>

            <fieldset
              class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
            >
              <legend class="fieldset-legend">Dados Pessoais</legend>

              <label class="label">Nome</label>
              <input
                name="name"
                type="text"
                class="input"
                value=""
                placeholder="Digite o seu nome completo"
                required
              />

              <label class="label">Email</label>
              <input
                name="email"
                type="email"
                class="input"
                value=""
                placeholder="Digite o seu email"
                required
              />
            </fieldset>
          </div>
          <label
            class="label text-xs text-wrap w-full py-6 flex justify-center items-center gap-2"
          >
            <input name="consent" type="checkbox" class="checkbox" required />
            Concordo com a coleta e o uso do meu nome e email conforme a GDPR.
          </label>
          <button type="submit" class="btn btn-primary">
            Enviar Solicitação de Reserva
          </button>
        </form>
      </div>
    </dialog>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
